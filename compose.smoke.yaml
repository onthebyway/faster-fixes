# Test-only email capture. Not loaded by normal docker compose up.
services:
  app:
    environment:
      MAILER_PROVIDER: smtp
      EMAIL_FROM: "FasterFixes <noreply@localhost>"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.29.2
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:8025:8025"
